{% extends "base.html" %}

{% block title %}Iniciar Sesión - Top Label{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-12 col-sm-8 col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 rounded-3">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <img src="{{ url_for('static', filename='images/TOPLABEL.png') }}" alt="Top Label Logo" class="mb-3" style="max-width: 150px;">
          <h4 class="fw-bold mb-1">Acceso al Sistema</h4>
          <p class="text-muted small">Control de Pendientes</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label for="username" class="form-label small fw-bold">Usuario o Correo:</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="usuario o correo" required autofocus>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label small fw-bold">Contraseña:</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Ingresar al Panel</button>
        </form>

        <div class="text-center mt-4">
          <small class="text-muted">Red Interna • Top Label</small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
