<div class="tareas-pilares mb-3">
  <div class="dashboard-section-label">Filtrar por pilar</div>
  <select class="form-select tabla-filtro-select tareas-pilar-select" data-row-field="pilar" data-filtro="pilar_id" aria-label="Pilar de {{ nombre|lower }}">
    <option value="">Todos los pilares · {{ tareas|length }} tareas{% set rojas = tareas|selectattr('semaforo','equalto','ROJO')|list|length %}{% if rojas %} · ⚠ {{ rojas }} vencidas/bloqueadas{% endif %}</option>
    {% for p in pilares %}{% set lista = tareas|selectattr('pilar_id','equalto',p.id)|list %}{% set rojas = lista|selectattr('semaforo','equalto','ROJO')|list|length %}<option value="{{ p.id }}">{{ p.nombre }} · {{ lista|length }} tareas{% if rojas %} · ⚠ {{ rojas }} vencidas/bloqueadas{% endif %}</option>{% endfor %}
    <option value="sin_pilar">Sin pilar · {{ tareas|selectattr('pilar_id','none')|list|length }} tareas{% set rojas = tareas|selectattr('pilar_id','none')|selectattr('semaforo','equalto','ROJO')|list|length %}{% if rojas %} · ⚠ {{ rojas }} vencidas/bloqueadas{% endif %}</option>
  </select>
  <div class="tareas-pilares-track" data-drag-scroll role="group" aria-label="Pilares de {{ nombre|lower }}">
    <button type="button" class="pilar-tab" data-pilar-filtro="" style="--pilar-border:#0284c7;--pilar-ink:#fff">Todos los pilares <span class="badge bg-light text-dark">{{ tareas|length }}</span>{% if tareas|selectattr('semaforo','equalto','ROJO')|list|length %}<span class="badge bg-danger" title="Hay tareas vencidas o bloqueadas">!</span>{% endif %}</button>
    {% for p in pilares %}{% set lista = tareas|selectattr('pilar_id','equalto',p.id)|list %}<button type="button" class="pilar-tab" data-pilar-filtro="{{ p.id }}" style="--pilar-border:{{ p.color_identificador }};--pilar-ink:{{ p.color_identificador|contraste }}">{{ p.nombre }} <span class="badge bg-light text-dark">{{ lista|length }}</span>{% if lista|selectattr('semaforo','equalto','ROJO')|list|length %}<span class="badge bg-danger" title="Hay tareas vencidas o bloqueadas">!</span>{% endif %}</button>{% endfor %}
    <button type="button" class="pilar-tab" data-pilar-filtro="sin_pilar" style="--pilar-border:#64748b;--pilar-ink:#fff">Sin pilar <span class="badge bg-light text-dark">{{ tareas|selectattr('pilar_id','none')|list|length }}</span>{% if tareas|selectattr('pilar_id','none')|selectattr('semaforo','equalto','ROJO')|list|length %}<span class="badge bg-danger" title="Hay tareas vencidas o bloqueadas">!</span>{% endif %}</button>
  </div>
  <p class="tareas-pilar-alert small text-danger mt-2 mb-0" role="status" hidden></p>
</div>
